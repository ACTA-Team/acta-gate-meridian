[workspace]
resolver = "2"
members = [
    # ACTA's contracts, from ACTA-Team/contracts-acta (dev @ 282fe47), modified here
    "vc-vault",
    "vc-vault-factory",
    "did-stellar-registry",
    # ACTA Gate
    "vc-gate",
    "credential-policy",
    "credential-vote",
    # Test-only: the treasury through a real smart account
    "integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
# Only ACTA's contracts inherit this: it is where they come from.
repository = "https://github.com/ACTA-Team/contracts-acta"

[workspace.dependencies]
soroban-sdk      = "26.1.0"
stellar-accounts = "0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
